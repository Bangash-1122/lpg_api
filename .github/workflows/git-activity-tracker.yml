name: Git Activity Tracker

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: git-activity-tracker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  track-commits:
    name: Track commits to Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required secrets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error title=Missing secret::GOOGLE_SERVICE_ACCOUNT_JSON is required and is not set."
            missing=1
          fi
          if [ -z "${GOOGLE_SHEET_ID:-}" ]; then
            echo "::error title=Missing secret::GOOGLE_SHEET_ID is required and is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install tracker dependencies
        working-directory: .git-activity-tracker
        run: npm ci

      - name: Record commits in Google Sheets
        working-directory: .git-activity-tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node track-commits.js
